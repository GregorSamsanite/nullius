[tips-and-tricks-item-description]
nullius-geology-1=你刚刚降落在一颗荒芜的星球上，部分设备在着陆时受损。你应该能从残骸中回收一座研究室。\n\n你对这颗星球还不熟悉，第一步是分析当地环境。放置从残骸中回收的 [entity=nullius-lab-1] 和 [entity=nullius-solar-panel-1]，开始研究 [technology=nullius-geology-1]。这项研究无需消耗科技包，研究室通电后就能开始。
nullius-chlorine=平衡 [fluid=nullius-chlorine] 和 [item=nullius-sodium-hydroxide] 的产量与消耗量，是工厂长期面临的问题。电解 [fluid=nullius-saline] 或 [fluid=nullius-brine] 时，这两种产物会一同生成。游戏初期，你还没有办法处理这两种副产物，因此必须把多余的产物储存起来。\n\n解锁相应科技后，可以将 [item=nullius-sodium-hydroxide] 按 [recipe=nullius-saline-caustic-solution] 配方溶解，再通过 [entity=nullius-outfall-1] 排放多余的氢氧化钠溶液。\n\n解锁相应科技后，可以将 [fluid=nullius-chlorine] 通过 [recipe=nullius-dust-disposal-1] 配方转化为惰性物质，再安全处理。继续研究还会解锁更好的氯处理方法。

nullius-power=刚着陆时，你只能依靠从残骸中回收的 [item=nullius-solar-panel-1] 和 [item=nullius-grid-battery-1] 来发电和储电。\n\n随着工厂扩大，你将能建造更多发电和储能设备。
nullius-priority=[item=nullius-electrolyzer-1]、[item=nullius-compressor-1]、[item=nullius-turbine-open-1] 和 [item=nullius-turbine-closed-1] 都有多种优先级模式，会影响它们何时用电或发电。将鼠标指向设备，按 __CONTROL__nullius-prioritize__ 即可循环切换模式。\n\n[font=heading-1]用电设备的优先级[/font]\n\n电解器和压缩机有两种用电模式：[font=default-bold]优先模式[/font]和[font=default-bold]电涌模式[/font]。\n\n在[font=default-bold]优先模式[/font]下，即使电网发电不足以满足全部需求，设备也会照常从电网取电，供电优先级和工厂里大多数设备相同。\n\n在[font=default-bold]电涌模式[/font]下，设备只会使用满足所有优先用电需求后剩余的电力。\n\n[font=heading-1]标准、排气和备用涡轮机[/font]\n\n开放式和封闭式涡轮机都有三种模式：[font=default-bold]标准[/font]、[font=default-bold]排气[/font]和[font=default-bold]备用[/font]。\n\n[font=default-bold]排气模式[/font]下，涡轮机会尽可能快地处理输入流体。发出的电优先供给电网，超出当前需求的部分会损失。这适合排掉多余的蒸汽或压缩气体，同时回收一部分能量。太阳能和风能也属于这一发电优先级。\n\n[font=default-bold]标准模式[/font]下，涡轮机在上一级电源之后补足剩余需求。剩余用电需求较低时，涡轮机会减少流体消耗。这种模式适合主力电站。\n\n[font=default-bold]备用模式[/font]的发电优先级最低。只有优先级更高的电源合计仍无法满足当前用电需求时，涡轮机才会消耗流体发电。这适合用储存的蒸汽或压缩气体补电。栅极电池也属于这一优先级。
nullius-hydrogen-battery=有富余电力时，把 [fluid=nullius-water] 送入 [entity=nullius-surge-electrolyzer-1]，分解成 [fluid=nullius-hydrogen] 和 [fluid=nullius-oxygen]。再把两种气体送入 [entity=nullius-combustion-chamber-1]，即可生成 [fluid=nullius-steam]。当电网发电不足时，可以将蒸汽送入 [entity=nullius-turbine-open-backup-1] 或 [entity=nullius-turbine-closed-backup-1] 发电。\n\n将鼠标指向 [item=nullius-electrolyzer-1]，按 __CONTROL__nullius-prioritize__ 切换到电涌模式。此后它只会在有富余电力时运行。\n\n[item=nullius-turbine-open-1] 和 [item=nullius-turbine-closed-1] 都可以用 __CONTROL__nullius-prioritize__ 在标准、排气和备用模式之间切换。标准模式与其他常规电源处于同一发电优先级。排气模式只要有气体输入就会持续运行，多发而未被使用的电力会被浪费。备用模式只在标准和排气模式的发电量不足时启动。
nullius-compressed-nitrogen-battery=有富余电力时，可以把 [fluid=nullius-nitrogen] 送入 [entity=nullius-surge-compressor-1] 压缩。当常规发电量低于需求时，将 [fluid=nullius-compressed-nitrogen] 送入 [entity=nullius-turbine-closed-backup-2] 减压发电，即可回收最初压缩气体所用的大部分电能。\n\n原理和 [tip=nullius-hydrogen-battery] 相似。这里把能量储存在 [fluid=nullius-compressed-nitrogen] 中，氢气储能则把能量储存在电解分离出的 [fluid=nullius-hydrogen] 和 [fluid=nullius-oxygen] 中。\n\n不同压缩气体每单位储存的能量不同，因此同样大小的储罐装满后，储存的能量也不同。[fluid=nullius-nitrogen] 容易大量取得，大多是生产中剩余的副产物，适合用来做压缩气体储能。还有比氮能量密度更高的压缩气体。随着工厂发展，你会解锁更多选择。
nullius-solar-thermal-power=[item=nullius-solar-collector-1] 会吸收太阳的热量，可以用这些热量把水烧成蒸汽来发电。入夜后，集热器还能保留一部分热量，提供少量储能。对每台集热器而言，每多一台相邻的集热器，效率就提高 10%。把集热器成片布置，可以提高单台的热量输出。
nullius-heat=[font=heading-1]产生热量[/font]\n\n[item=nullius-solar-collector-1] 在白天将太阳能转化为热量。将 [item=nullius-geothermal-plant-1] 建在 [entity=nullius-fumarole] 上，可以持续产生稳定的热量，且不会耗尽 [fluid=nullius-volcanic-gas]。[item=nullius-reactor] 则消耗核燃料来产生热量。\n\n[font=heading-1]利用热量[/font]\n\n热量可以用来生成 [fluid=nullius-steam]（通过 [item=nullius-heat-exchanger-1]），也可以直接驱动 [item=nullius-stirling-engine-1] 发电。用蒸汽驱动涡轮机发电比用斯特林发动机更高效，但系统也更复杂。换热器产生的蒸汽也能用于工业生产，例如更省电的 [recipe=nullius-steam-electrolysis]。\n\n[font=heading-1]储存热量[/font]\n\n产生和消耗热量的设备都能靠自身热容缓冲一部分热量。专用的 [item=nullius-thermal-tank-1] 可以储存更多集热器白天产生的热量，留到夜间使用。

nullius-plumbing=为了完成任务，工厂需要生产多种流体、平衡它们的产量和消耗，并排放多余的流体。管理好这些流体，工厂才能持续运转。
nullius-pipe-extents=管网有最大延伸范围，具体上限取决于管道材质。材质越高级，管网就能延伸得越远。混用不同材质的管道时，以其中最小的上限为准。\n\n管网达到上限后，可以用泵把流体输送到下一段。将补充泵和溢流泵按相反方向布置，可以在两段管网之间按需向任一方向输送流体。\n\n中型和大型储罐的延伸范围比同级管道小，大型储罐的范围最小。用泵把储罐和主管网隔开，可以保留主管网的最大延伸范围。
nullius-pump-modes=按 __CONTROL__configurable-valves-switch__ 可以切换泵的工作模式。\n\n[font=default-bold]普通泵[/font]会从输入侧向输出侧泵送，不受两侧液位阈值控制。\n\n[font=default-bold]溢流泵[/font]只在输入侧液位达到 80% 或更高时泵送。\n\n[font=default-bold]补充泵[/font]只在输出侧液位降到 80% 或更低时泵送。\n\n[font=default-bold]单向泵[/font]只在输入侧液位高于输出侧时泵送。泵的阈值可以逐台调整。

nullius-terraforming=你是由创造者派出的环境改造仿生人，任务是改造银河系中的荒芜星球，让生命在群星之间传播。你已降落在这颗星球上。接下来，你要建造一座能够改造当地环境的工厂，从原料合成生命，并派出下一批环境改造仿生人，让他们继续执行任务。
nullius-oxygen-venting=这颗星球的大气中没有游离的 [fluid=nullius-oxygen]。你的长期目标之一，是逐步提高大气含氧量，让生物先能存活，再能大量繁衍。\n\n要获得氧，只能分解 [fluid=nullius-water] 或 [fluid=nullius-carbon-dioxide]，从它们的分子中提取已有的氧。游戏中，电解 1 单位水会产生 1 单位 [fluid=nullius-oxygen] 和 2 单位 [fluid=nullius-hydrogen]。排放氧会增加大气含氧量。排放氢则会消耗大气中的氧，因为氢会和氧重新结合成水蒸气。要持续提高大气含氧量，需要用其他工序消耗氢，避免将它排入大气。\n\n其他气体排入大气后也可能消耗氧，抵消一部分改造成果。每排放 2 单位 [fluid=nullius-hydrogen] 会消耗 1 单位 [fluid=nullius-oxygen]，所以每排放 1 单位氢，就会抵消 0.5 单位的氧气排放量，扣减率为 50%。其他气体也有各自的扣减率。\n\n[fluid=nullius-volcanic-gas]：20%\n[fluid=nullius-hydrogen]：50%\n[fluid=nullius-carbon-monoxide]：50%\n[fluid=nullius-deuterium]：50%\n[fluid=nullius-ammonia]：100%\n[fluid=nullius-methane]：200%
nullius-land-fill-dumping=[recipe=nullius-dumping-rock]、[recipe=nullius-dumping-dirt] 和 [recipe=nullius-dumping-sand] 这三种配方可以自动处理大量副产物。地质改造型无人机会装载大量填海材料，飞往星球上的偏远地区倾倒，避开环境改造所需的敏感区域。凡是能制成填海材料的副产物，都可以用这种方式处理。部分无人机能完成长途飞行并返回，拆解出的零件可以再次利用。\n\n可用这种方式处理的副产物包括 [item=nullius-box-gravel]、[item=nullius-box-sand]、[item=nullius-box-mineral-dust]、[item=nullius-box-graphite]、[item=nullius-box-plastic]、[item=nullius-box-acid-boric]、[item=nullius-box-cellulose] 和 [fluid=nullius-chlorine]。有些副产物需要先加工才能倾倒，例如先用 [recipe=nullius-plastic-pyrolysis]，再用 [recipe=nullius-carbon-sink] 处理。

nullius-biology=你的工厂现在能够合成构成生命的基本物质，并以这些物质为原料，创造能在当地环境中繁衍的新生物。
nullius-bootstrapping-biology=你已经掌握了合成生命基本原料的技术，包括 [fluid=nullius-amino-acids]、[fluid=nullius-fatty-acids]、[fluid=nullius-nucleotides] 和 [item=nullius-sugar]。生物能高效合成维持自身生存所需的这些物质，但你目前还没有可以利用的生物。\n\n人工合成这些原料耗时且耗能。建议尽早建一座小型生物化工厂，先以小规模持续生产这些原料。积攒到足够数量后，就能合成第一批可以自行繁殖的生物。此后再从这些生物中获取原料，效率会更高。
nullius-creating-life=能自行繁殖的种群，需要从最初一批人工合成的个体开始。环境改造所需的每一种新生物，都要先经过这一步。通过生物研究，你已经开发出一种能在当地环境中大量繁殖的 [fluid=nullius-bacteria]。先用 [recipe=nullius-bacteria] 合成初始菌群，再以这批菌群为引子，通过 [recipe=nullius-bacteria-2] 建立能够自行繁殖的菌落。\n\n之后每创造一种新生物，基本都遵循这个过程：先合成少量个体，再用这批个体建立能自行繁殖的种群。
