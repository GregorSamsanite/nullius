[tips-and-tricks-item-description]
nullius-geology-1=You've just landed on a barren planet. Some of your equipment was damaged in the landing. You should be able to salvage a lab from the wreckage.\n\nThis planet is unfamiliar to you. To get started you first need to analyse the local environment. Place down the [entity=nullius-lab-1] and [entity=nullius-solar-panel-1] you salvaged and start researching [technology=nullius-geology-1]. This first research does not require any science packs, only a powered lab.
nullius-chlorine=Balancing the production and consumption of [fluid=nullius-chlorine] and [item=nullius-sodium-hydroxide] will be an ongoing challenge for your factory. Both of these are produced when electrolysing [fluid=nullius-saline] or [fluid=nullius-brine]. Initially your factory has no way to void either of these, so you must store any excess that you produce.\n\nOnce researched, [item=nullius-sodium-hydroxide] can be dissolved using [recipe=nullius-saline-caustic-solution], and excess caustic solution can be voided using an [entity=nullius-outfall-1].\n\nOnce researched, [fluid=nullius-chlorine] can be rendered inert by [recipe=nullius-dust-disposal-1] and then safely disposed of. As your research progresses you will unlock improved methods of chlorine disposal.

nullius-power=Immediately after landing, your power generation and storage options are limited to the [item=nullius-solar-panel-1] and [item=nullius-grid-battery-1] you can scavenge from the wreckage.\n\nAs your factory grows you will be able to construct more power generation and storage options.
nullius-priority=[item=nullius-electrolyzer-1], [item=nullius-compressor-1], [item=nullius-turbine-open-1], and [item=nullius-turbine-closed-1] each have multiple priority modes that affect how they consume or produce power. You can cycle through each of the priority modes for an entity using __CONTROL__nullius-prioritize__.\n\n[font=heading-1]Priority and surge consumers[/font]\n\nElectrolyzers and compressors have two modes of power consumption: [font=default-bold]priority[/font] and [font=default-bold]surge[/font].\n\nA [font=default-bold]priority[/font] consumer will always run, even if the power grid has insufficient production to satisfy all power demand. This is the same prioritization as most entities in your factory.\n\nA [font=default-bold]surge[/font] consumer will only draw power when there is excess power production available in the grid after all priority consumers have been fully powered.\n\n[font=heading-1]Standard, exhaust, and backup turbines[/font]\n\nBoth open and closed turbines have three prioritization modes: [font=default-bold]standard[/font], [font=default-bold]exhaust[/font], and [font=default-bold]backup[/font].\n\nAn [font=default-bold]exhaust[/font] turbine will always process its fluid input as fast as it can. Any power generated is provided to the grid at priority, but any power generated by an exhaust turbine in excess of the current power demand is lost. This is good for voiding excess steam and compressed gasses, recovering some energy in the process. Renewable power sources such as solar and wind are included in this production bracket.\n\nA [font=default-bold]standard[/font] turbine will process its fluid input and produce power after the previous production bracket, and only till all power consumers are satisfied. This is good for a primary power plant. It will process its fluid input at a reduced rate if there is low power demand compared to availale power production.\n\nA [font=default-bold]backup[/font] turbine is the lowest priority power producer. It will only process its fluid input and produce power if all previous power generation brackets have not produced enough power to satisfy the current power demand. This is good for venting stored steam or compressed gasses as a form of energy storage. Grid batteries are included in this production bracket.
nullius-hydrogen-battery=Using excess power you can split [fluid=nullius-water] in a [entity=nullius-surge-electrolyzer-1] to get [fluid=nullius-hydrogen] and [fluid=nullius-oxygen]. These can be combined in a [entity=nullius-combustion-chamber-1] to produce [fluid=nullius-steam]. This steam can be vented in an [entity=nullius-turbine-open-backup-1] or [entity=nullius-turbine-closed-backup-1] to generate power in times of low generation.\n\nAn [item=nullius-electrolyzer-1] can be configured to only run when there is excess power generation using __CONTROL__nullius-prioritize__ to switch it to surge mode.\n\n[item=nullius-turbine-open-1] and [item=nullius-turbine-closed-1] can be configured in standard, exhaust, or backup mode using __CONTROL__nullius-prioritize__. Turbines in standard mode will generate power with the same priority as other power generation methods. Exhaust turbines always run if there is an input gas, discarding any extra electricity generated that was not consumed. Backup turbines are only enabled when standard and exhaust turbines are generating insufficient power.
nullius-compressed-nitrogen-battery=Using excess power you can compress [fluid=nullius-nitrogen] in an [entity=nullius-surge-compressor-1]. When baseline power generation drops below demand the [fluid=nullius-compressed-nitrogen] can be decompressed through a [entity=nullius-turbine-closed-backup-2] recovering most of the power that was used to compress the gas initially.\n\nThis is similar in concept to the [tip=nullius-hydrogen-battery], with the power stored in the [fluid=nullius-compressed-nitrogen] instead of in the split [fluid=nullius-hydrogen] and [fluid=nullius-oxygen].\n\nDifferent compressed gasses store different amounts of energy. This affects how much energy is stored per unit of compressed gas, and therefore how much energy is stored in one tank of compressed gas. [fluid=nullius-nitrogen] is easy to obtain in large quantities and is mostly a waste product, making it a straight forward option for compressed gas energy storage. It is not the most energy dense compressed gas available, and more compressed gasses will become available as your factory progresses.
nullius-solar-thermal-power=[item=nullius-solar-collector-1] will absorb the heat of the sun. This heat can be used to boil water and create power. A solar collector will retain some of its heat in to the night providing a small amount of power storage. Solar collectors gain a 10% efficiency boost for each neighbouring collector, so placing them in a block will output more heat per collector.
nullius-heat=[font=heading-1]Producing heat[/font]\n\nA [item=nullius-solar-collector-1] converts solar energy during the day in to heat. A [item=nullius-geothermal-plant-1] is built on an [entity=nullius-fumarole] and produces a constant amount of heat without depleting the [fluid=nullius-volcanic-gas]. A [item=nullius-reactor] consumes nuclear fuels and outputs heat.\n\n[font=heading-1]Consuming heat[/font]\n\nHeat can be used in two ways: generating [fluid=nullius-steam] in a [item=nullius-heat-exchanger-1] or driving a [item=nullius-stirling-engine-1] to directly produce power. Steam can be used to produce power in a turbine more efficiently than with a Stirling engine, at the cost of increased complexity. Steam from a heat exchanger can also be used to drive industrial processes, such as the more power efficient [recipe=nullius-steam-electrolysis].\n\n[font=heading-1]Storing heat[/font]\n\nAll heat producers and consumers have some amount of thermal mass that acts as a heat buffer. The [item=nullius-thermal-tank-1] provides dedicated heat storage which can help carry more heat from solar collectors through the night.

nullius-plumbing=Your factory will need to produce, balance, and void many different fluids to complete your goal. Careful management of these fluids is essential for a functioning factory.
nullius-pipe-extents=Pipelines have a limited extent. Different pipe materials will have different maximum pipeline extents, with improvements to the maximum pipeline extent corresponding to more advanced pipe materials. A pipeline made of multiple kinds of pipes has the extent of its lowest extent pipe.\n\nA pipeline that has reached its limit can be extended by adding pumps to move the fluid. A two-way flow can be established using a combination of top-up and overflow pumps moving fluids in opposite directions.\n\nMedium and large fluid tanks have smaller extents than pipes of the same tier, with large tanks having the smallest extent. Isolate tanks behind pumps to maintain maximum pipeline extent.
nullius-pump-modes=Pumps can be set to operate in three different modes using __CONTROL__configurable-valves-switch__.\n\n[font=default-bold]Regular pumps[/font] will always pump fluid from the input side to the output side regardless of fluid levels.\n\n[font=default-bold]Overflow pumps[/font] will only pump when the fluid level on the input side is 80% or higher.\n\n[font=default-bold]Top-up pumps[/font] will only pump when the fluid level on the output side is 80% or lower.\n\n[font=default-bold]One way[/font] pumps will pump fluid if the fluid level on the input side is higher than the fluid level on the output side. The threshold values can be modified per pump.

